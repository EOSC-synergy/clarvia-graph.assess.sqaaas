      github.com/clarvia-org/clarvia-graph jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.silver_sad_capybara.sh
        container: qc.sty_vermilion_honest_lynx
  QC.Ver:
    repos:
      github.com/clarvia-org/clarvia-graph get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_silly_caiman.sh
        container: qc.ver_cosmos_wise_squid
