config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/clarvia-org/clarvia-graph:
      branch: main
      repo: https://github.com/clarvia-org/clarvia-graph
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.cayenne_wise_manatee.sh
        container: qc.acc_bronze_stubborn_badger
  QC.Doc:
    repos:
      github.com/clarvia-org/clarvia-graph find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.avocado_anxious_camel.sh
        container: qc.doc_banana_fearless_elephant
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_zealous_elephant.sh
        container: qc.doc_indigo_sad_salamander
      github.com/clarvia-org/clarvia-graph markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.mulberry_tough_moose.sh
        container: qc.doc_chartreuse_easygoing_condor
  QC.Lic:
    repos:
      github.com/clarvia-org/clarvia-graph licensee:
        commands:
        - /usr/bin/env sh .sqa/script.peony_stoic_elk.sh
        container: qc.lic_thunder_honest_goose
  QC.Met:
    repos:
      github.com/clarvia-org/clarvia-graph cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.alabaster_adventurous_echidna.sh
        container: qc.met_saffron_dreamy_flounder
  QC.Sty:
    repos:
      github.com/clarvia-org/clarvia-graph jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_playful_griffin.sh
        container: qc.sty_iris_jubilant_wasp
  QC.Ver:
    repos:
      github.com/clarvia-org/clarvia-graph get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.denim_whimsical_octopus.sh
        container: qc.ver_maroon_tranquil_ostrich
timeout: 5400
