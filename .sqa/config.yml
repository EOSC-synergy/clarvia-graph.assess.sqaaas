config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/clarvia-org/clarvia-graph:
      branch: main
      repo: https://github.com/clarvia-org/clarvia-graph
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.saffron_mischievous_walrus.sh
        container: qc.acc_tangerine_melancholy_tiger
  QC.Doc:
    repos:
      github.com/clarvia-org/clarvia-graph find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_enigmatic_badger.sh
        container: qc.doc_periwinkle_jubilant_swan
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.mauve_eccentric_moth.sh
        container: qc.doc_jasmine_thankful_uakari
      github.com/clarvia-org/clarvia-graph markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.clove_scrappy_termite.sh
        container: qc.doc_emerald_honest_hippopotamus
  QC.Lic:
    repos:
      github.com/clarvia-org/clarvia-graph licensee:
        commands:
        - /usr/bin/env sh .sqa/script.pistachio_confident_wasp.sh
        container: qc.lic_iris_devoted_turtle
  QC.Met:
    repos:
      github.com/clarvia-org/clarvia-graph cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.cadet_understanding_beaver.sh
        container: qc.met_ecru_relaxed_opossum
  QC.Sty:
    repos:
      github.com/clarvia-org/clarvia-graph jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.khaki_upbeat_squid.sh
        container: qc.sty_salmon_perky_macaw
  QC.Ver:
    repos:
      github.com/clarvia-org/clarvia-graph get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.rose_blissful_hedgehog.sh
        container: qc.ver_ebony_artistic_flamingo
timeout: 5400
