config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/clarvia-org/clarvia-graph:
      branch: main
      repo: https://github.com/clarvia-org/clarvia-graph
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.ochre_reckless_alpaca.sh
        container: qc.acc_amethyst_sweet_anaconda
  QC.Doc:
    repos:
      github.com/clarvia-org/clarvia-graph find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.peony_whimsical_antelope.sh
        container: qc.doc_peach_creative_wasp
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.heather_zany_fox.sh
        container: qc.doc_tangerine_silly_clownfish
      github.com/clarvia-org/clarvia-graph markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_brilliant_pangolin.sh
        container: qc.doc_smoke_optimistic_gerbil
