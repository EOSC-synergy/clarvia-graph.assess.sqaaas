        - /usr/bin/env sh .sqa/script.arctic_reckless_tiger.sh
        container: qc.doc_red_visionary_stork
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_focused_impala.sh
