      github.com/clarvia-org/clarvia-graph jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.alabaster_innocent_dugong.sh
        container: qc.sty_rosewater_thoughtful_owl
  QC.Ver:
    repos:
      github.com/clarvia-org/clarvia-graph get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.seafoam_wise_falcon.sh
        container: qc.ver_mist_eccentric_whale
