        - /usr/bin/env sh .sqa/script.kiwi_apathetic_hyena.sh
        container: qc.doc_peony_empathetic_octopus
      github.com/clarvia-org/clarvia-graph git:
        commands:
        - /usr/bin/env sh .sqa/script.rust_analytical_narwhal.sh
